-- Paste this entire file into Supabase > SQL Editor > Run
-- Idempotent: uses IF NOT EXISTS, safe to re-run

-- Extensions
create extension if not exists "pgcrypto";
create extension if not exists "uuid-ossp";

-- Enums
do $$ begin
  create type animal_breed as enum ('Gir','Sahiwal','Kankrej','Gir Cross');
exception when duplicate_object then null; end $$;
do $$ begin
  create type animal_status as enum ('Lactating','Dry','Heifer','Calf','Bull');
exception when duplicate_object then null; end $$;

-- Farms
create table if not exists public.farms (
  id text primary key,
  name text not null,
  created_at timestamptz default now()
);

-- Animals (core herd)
create table if not exists public.animals (
  id uuid primary key default gen_random_uuid(),
  tag text unique not null,
  name text,
  breed animal_breed default 'Gir',
  dob date,
  dam text,
  sire text,
  lactation int default 1,
  status animal_status default 'Lactating',
  farm_id text references public.farms(id) on delete set null,
  photo text, -- cdn.fbsbx.com / fbcdn.net blob URL or DataURL
  milk_avg float default 0,
  inbreeding_f float default 0, -- Wright's F cached
  created_at timestamptz default now(),
  updated_at timestamptz default now()
);
create index if not exists idx_animals_farm on public.animals(farm_id);
create index if not exists idx_animals_tag on public.animals(tag);

-- Morphology records (canvas + fbsbx)
create table if not exists public.morphology_records (
  id uuid primary key default gen_random_uuid(),
  date date default current_date,
  animal_tag text references public.animals(tag) on delete cascade,
  image_url text,
  fbsbx_url text,
  points jsonb default '[]'::jsonb, -- [{x,y,label,id}]
  metrics jsonb, -- {sharp,bright,bcs,hg,height,length,weight}
  bcs float,
  height_cm float,
  length_cm float,
  girth_cm float,
  weight_kg float,
  notes text,
  created_at timestamptz default now()
);

-- Sonography (ultrasound)
create table if not exists public.sonography_records (
  id uuid primary key default gen_random_uuid(),
  date date default current_date,
  animal_tag text references public.animals(tag) on delete cascade,
  image_url text,
  fbsbx_url text,
  filter_mode text default 'none' check (filter_mode in ('none','contrast','invert','sobel')),
  annotations jsonb default '[]'::jsonb, -- ruler/circle
  report jsonb, -- {follicles,cl,fluid,sizes}
  pregnancy text default 'Open',
  follicles int default 0,
  cl boolean default false,
  created_at timestamptz default now()
);

-- ET Lab embryos
create table if not exists public.embryos (
  id uuid primary key default gen_random_uuid(),
  image_url text,
  fbsbx_url text,
  stage text check (stage in ('Morula','Early Blast','Blastocyst','Expanded','Hatched')),
  icm text check (icm in ('A','B','C')),
  trophe text check (trophe in ('A','B','C')),
  donor_tag text references public.animals(tag) on delete set null,
  straw_id text unique,
  batch_id text,
  grade int check (grade between 1 and 4),
  decision text check (decision in ('Transferable','Freezable','Discard')),
  metrics jsonb, -- symmetry, compaction, fragmentation, icmPct, tropheSmooth
  created_at timestamptz default now()
);
create index if not exists idx_embryos_batch on public.embryos(batch_id);

-- Semen inventory
create table if not exists public.semen_inventory (
  id uuid primary key default gen_random_uuid(),
  bull_name text not null,
  doses int default 0,
  motility int check (motility between 0 and 100),
  concentration float, -- B/ml
  tank text,
  canister text,
  collection_date date default current_date,
  created_at timestamptz default now()
);

-- Breeding logs + 6-gen pedigree
create table if not exists public.breeding_logs (
  id uuid primary key default gen_random_uuid(),
  female_tag text references public.animals(tag) on delete cascade,
  heat_date date,
  ai_type text check (ai_type in ('AI','Sexed','ET','Natural')),
  semen_used text,
  technician text,
  pd_result text check (pd_result in ('Pending','Positive','Negative')),
  notes text,
  created_at timestamptz default now()
);

-- Mating plans (Wright + GEBV + NM$)
create table if not exists public.mating_plans (
  id uuid primary key default gen_random_uuid(),
  female_id uuid references public.animals(id) on delete cascade,
  female_tag text,
  bull_tag text,
  bull_name text,
  inbreeding_f float,
  nm_dollar float,
  gebv float,
  ebv float,
  pta float,
  suggestion text, -- AI/Sexed/ET
  plan_date date default current_date,
  created_at timestamptz default now()
);

-- Heat AI
create table if not exists public.heat_alerts (
  id uuid primary key default gen_random_uuid(),
  animal_tag text references public.animals(tag) on delete cascade,
  alert_date date default current_date,
  status text check (status in ('Heat','Confirmed','Missed','AI Done')),
  confidence int,
  activity int,
  temp_c float,
  created_at timestamptz default now()
);

-- Genomics - GirGyn v1 87 contigs
create table if not exists public.girgyn_contigs (
  id int primary key,
  name text unique not null,
  length_bp bigint,
  gene_count int,
  snp_density float,
  qtl text
);

-- Genomic files (FASTA/VCF/GFF)
create table if not exists public.genomic_files (
  id uuid primary key default gen_random_uuid(),
  name text,
  file_type text check (file_type in ('FASTA','VCF','GFF')),
  content text, -- first 5000 chars preview
  result jsonb, -- {count,total,n50,het,hom,ti,tv,tiTv}
  created_at timestamptz default now()
);

-- SNPs
create table if not exists public.snps (
  id uuid primary key default gen_random_uuid(),
  file_id uuid references public.genomic_files(id) on delete cascade,
  contig_id int references public.girgyn_contigs(id),
  pos int,
  ref text,
  alt text,
  created_at timestamptz default now()
);
create index if not exists idx_snps_file on public.snps(file_id);

-- Economics
create table if not exists public.economics (
  id uuid primary key default gen_random_uuid(),
  date date default current_date,
  animal_tag text references public.animals(tag) on delete cascade,
  milk_yield_l float,
  price_per_l float default 38,
  feed_cost float default 0,
  other_cost float default 0,
  profit float generated always as (milk_yield_l*price_per_l - feed_cost - other_cost) stored,
  created_at timestamptz default now()
);

-- Feed formulation
create table if not exists public.feed_rations (
  id uuid primary key default gen_random_uuid(),
  name text unique,
  ingredients text,
  dm_percent float,
  cp_percent float,
  tdn_percent float,
  cost_rs float,
  for_stage text,
  created_at timestamptz default now()
);

-- IoT collars
create table if not exists public.iot_collars (
  id uuid primary key default gen_random_uuid(),
  collar_id text unique,
  animal_tag text references public.animals(tag) on delete set null,
  battery int check (battery between 0 and 100),
  status text check (status in ('Active','Offline','Charging')),
  temp_c float,
  last_seen timestamptz default now(),
  live_points jsonb default '[]'::jsonb, -- [{t,act}]
  created_at timestamptz default now()
);

-- Storage bucket for fbsbx fallback (create manually or via SQL if allowed)
-- insert into storage.buckets (id, name, public) values ('bharat-dairy-fbsbx','bharat-dairy-fbsbx', true) on conflict (id) do nothing;

-- RLS
alter table public.farms enable row level security;
alter table public.animals enable row level security;
alter table public.morphology_records enable row level security;
alter table public.sonography_records enable row level security;
alter table public.embryos enable row level security;
alter table public.semen_inventory enable row level security;
alter table public.breeding_logs enable row level security;
alter table public.mating_plans enable row level security;
alter table public.heat_alerts enable row level security;
alter table public.girgyn_contigs enable row level security;
alter table public.genomic_files enable row level security;
alter table public.snps enable row level security;
alter table public.economics enable row level security;
alter table public.feed_rations enable row level security;
alter table public.iot_collars enable row level security;

-- Policies (open for anon for demo, tighten in prod)
do $$ declare t text; begin
  for t in select unnest(array['farms','animals','morphology_records','sonography_records','embryos','semen_inventory','breeding_logs','mating_plans','heat_alerts','girgyn_contigs','genomic_files','snps','economics','feed_rations','iot_collars']) loop
    execute format('drop policy if exists "allow_all" on public.%I', t);
    execute format('create policy "allow_all" on public.%I for all using (true) with check (true)', t);
  end loop;
end $$;

-- Seed GirGyn contigs (87)
-- NOTE: In Supabase SQL editor, run this separately if needed, or keep as is (idempotent)
insert into public.girgyn_contigs (id,name,length_bp,gene_count,snp_density,qtl)
select * from (values
  (1,'GirGyn_Contig_001',3200000,45,1.2,'Milk QTL'),
  (2,'GirGyn_Contig_002',4100000,32,2.1,'Fat %')
) as v(id,name,length_bp,gene_count,snp_density,qtl)
on conflict (id) do nothing;

-- Views
create or replace view public.v_herd_summary as
select f.id as farm_id, f.name as farm_name, count(a.id) as total_animals,
  avg(a.milk_avg) as avg_milk, sum(case when a.status='Lactating' then 1 else 0 end) as lactating_count
from public.farms f left join public.animals a on a.farm_id=f.id group by f.id,f.name;

create or replace view public.v_monthly_profit as
select date_trunc('month', date)::date as month, sum(profit) as net_profit, sum(milk_yield_l) as total_yield
from public.economics group by 1 order by 1;

-- Function: recalc inbreeding placeholder
create or replace function public.recalc_inbreeding()
returns trigger as $$
begin
  new.updated_at=now(); return new;
end; $$ language plpgsql;
drop trigger if exists trg_animals_upd on public.animals;
create trigger trg_animals_upd before update on public.animals for each row execute function public.recalc_inbreeding();
